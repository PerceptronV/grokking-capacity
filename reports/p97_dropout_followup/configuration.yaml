limits:
  - These are protocol-dependent finite-training estimates, not architecture-only bounds.
  - Changing dropout can change capacity; keep A fixed for the grokking question rather than resizing it after seeing outcomes.
  - Inspect dataset-limited maxima and late drift; flag unresolved saturation rather than force agreement with 2.16.
  - Original and new arithmetic horizons differ: 5000 epochs here versus 12000 previously.
