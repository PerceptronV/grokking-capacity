name: p97_dataset_matched_categorical_continuous_scaling
registered: '2026-10-26'
branch: idea/discrete
purpose: Look for a reversal in C/B generalisation-time ordering as training dataset size increases logarithmically.
common:
  p: 97
  depth: 2
  heads: 1
  dropout: 0.2
  lr: 0.001
  weight_decay: 1.0
  beta1: 0.9
  beta2: 0.98
  batch_size: 512
  max_updates: 50000
  eval_every: 10
  train_pool_size: 7449
models:
  source: reports/p97_capacity_scaling/selection.json
  tolerance: 0.1
  width_candidates: {start: 2, stop: 160, step: 2}
  selection: Fix the ten dataset sizes first. For each role and N choose the even width minimizing abs(kappa_role*P_role/(N*log2(99))-1); ties favor smaller width. Keep depth2, heads1 and FF=4d. Require each model versus dataset and B versus C to match within10%. Freeze all choices before any training outcome.
  constants: C=0.7291169353321082 and B=0.31091702370607593 bits per parameter, inherited from the audited previous calibration. C parameter count=32d^2+203d; B=64d^2+203d. Report prediction error and calibration extrapolation at every size.
  scope: Predicted empirical-capacity matching via constants; not direct random-label measurements at every width. Below-calibration widths are explicit extrapolations. No architecture is selected for arithmetic success.
  C: Ordinary fully continuous transformer, FF=4d.
  B: Full-width categorical transformer, FF=4d, alphabet8, L=d, slot LayerNorm eps1e-4, temperature1, deterministic hard argmax forward, softmax STE backward, learned embedding sums, no continuous bypass.
dataset:
  operation: modular_division
  minimum_training_examples: 928
  maximum_training_examples: 7449
  size_count: 10
  sizes: [928, 1170, 1474, 1858, 2342, 2952, 3720, 4689, 5910, 7449]
  generation: Rounded numpy geomspace from 928 to 7449. The lower endpoint was raised from the unlaunched fixed-pair proposal so even-width rounding meets the10% prediction tolerance without changing FF ratios; no outcomes informed the grid. For each seed uniformly permute the 9312 input pairs once; training subsets are prefixes of lengths N, test set is the last 1863 examples, and unused pool entries are excluded from both. Every role and size share that seed's test set. No random labels are trained in this campaign.
  complexity: N*log2(99), retained for comparability with the empirical capacity calibration; modular targets themselves occupy 97 classes.
confirmation:
  seeds: [501, 502, 503, 504, 505, 506, 507, 508, 509, 510]
  runs: 200
  shuffle: Reshuffle training examples each epoch with torch.randperm, retain final partial batch. Model initialization and dropout/shuffle use the original torch seed stream; architecture shapes make those streams different across roles. Data uses an independent saved/restored NumPy RNG state.
  evaluation: Evaluate held-out and dropout-free training accuracy every ten actual optimizer updates, including across epoch boundaries. Online training accuracy is example-weighted across the preceding ten updates. Evaluation consumes no RNG.
  stopping: First evaluation with three consecutive held-out accuracies >=99% and current online-window training accuracy >=99%, otherwise exactly50000 updates. Never drop or replace a failed seed.
  primary: First held-out99 evaluation in actual optimizer updates; missing crossings are right-censored at50000. Also report examples processed and epoch equivalents.
  secondary: Sustained held-out99, final train/test learning check, joint stopping, online-train99 to held-out98 clipped delay and dropout-free counterpart; retain undefined thresholds.
  comparability: Fresh runs only. Test-set size and evaluation windows differ from the previous 50% model-size sweep; do not combine those times into this curve.
analysis:
  crossing: An observed mean-curve crossing requires a sign reversal of mean(B)-mean(C) between adjacent sizes with all twenty first crossings observed. Interpolate log(N) only as a descriptive bracket estimate. Do not extrapolate crossing from power laws or treat capped means as uncensored means.
  uncertainty: Paired bootstrap of ten seed IDs, 10000 resamples, seed9002, retaining cross-size pairing. Report pointwise95% intervals for paired mean differences and ratios and simultaneous95% centered-bootstrap maximum-deviation bands across all ten capped differences. A resolved crossing requires opposite-sign simultaneous bands at two fully observed sizes. Otherwise distinguish an observed reversal from unresolved evidence.
  censored: Report all-seed means only when complete, otherwise lower bounds; medians only when identifiable. Analyze min(t_gen,50000) separately over all sizes. Preserve all failures and individual times; no successful-seed-only averages.
  scope: Fixed p97, ten logarithmic dataset sizes, one newly sized B/C pair per size. Both dataset size and predicted model capacity grow together; this is not an isolated dataset-size effect. Absence of observed crossing is limited to this range and update budget.
resources:
  device: cuda:1
  workers: 4
  threads_per_worker: 2
  note: Both GPUs currently have unrelated workloads; leave them untouched. Limit this campaign to four workers on GPU1. No fused optimizer or changed training math.
