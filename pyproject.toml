[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grokking_capacity"
version = "0.2.0"
description = "Empirical study of grokking onset as a function of model capacity, predicted from memorisation and generalisation speeds."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "psutil>=7.0.0",
    "scipy>=1.15.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    # Pinned to 0.1.0; 0.2.0 adds an auto `uuid` column which grokking_capacity's
    # current registry/lifecycle.py doesn't need. Bump after the registry
    # cleanup PR migrates to wallow.contrib.lifecycle + Store.artefacts_dir.
    "wallow==0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
gc-capacity = "grokking_capacity.experiments.capacity:main"
gc-speed = "grokking_capacity.experiments.speed:main"
gc-groks = "grokking_capacity.experiments.groks:main"
gc-dispatch = "grokking_capacity.dispatch.main:main"
gc-figures = "grokking_capacity.analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grokking_capacity = ["py.typed"]
