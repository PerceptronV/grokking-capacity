[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grokking_capacity"
version = "0.2.0"
description = "Empirical study of grokking onset as a function of model capacity, predicted from memorisation and generalisation speeds."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "psutil>=7.0.0",
    "scipy>=1.15.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    # 0.2.0 adds a native `uuid` column, [project].artefacts_root/layout +
    # Store.artefacts_dir, and wallow.contrib.lifecycle — all used by the
    # registry layer below.
    "wallow>=0.2.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
gc-capacity = "grokking_capacity.experiments.capacity:main"
gc-speed = "grokking_capacity.experiments.speed:main"
gc-groks = "grokking_capacity.experiments.groks:main"
gc-dispatch = "grokking_capacity.dispatch.main:main"
gc-figures = "grokking_capacity.analysis.cli:main"
gc-error-decay = "grokking_capacity.analysis.error_decay:main"
gc-contraction = "grokking_capacity.analysis.contraction:main"
gc-rate-vs-capacity = "grokking_capacity.analysis.rate_vs_capacity:main"
gc-threshold-invariance = "grokking_capacity.analysis.threshold_invariance:main"
gc-kappa-stability = "grokking_capacity.analysis.kappa_stability:main"
gc-bridge = "grokking_capacity.analysis.bridge:main"
gc-mem-law = "grokking_capacity.analysis.mem_law:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grokking_capacity = ["py.typed"]
