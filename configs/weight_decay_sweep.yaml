name: weight_decay_sweep
description: "Weight decay sensitivity with MATCHED weight_decay between speed and groks (Experiment 1a)"

defaults:
  operation: "/"
  train_fraction: 0.5
  split_type: random
  depth: 2
  heads: 1
  dropout: 0.2
  lr: 0.001
  beta1: 0.9
  beta2: 0.98
  batch_size: 512
  max_epochs: 5000
  primes: [113]
  seeds: [42, 43, 44]

experiments:
  capacity:
    type: capacity
    weight_decay: 1.0
    dropout: 0.0
    primes: [113]
    dims: [10, 12, 14, 16, 18, 20, 22]
    n_samples: [1000, 1374, 1891, 2601, 3576, 4917, 6761, 9300]
    seeds: [42]

  speed:
    type: speed
    # weight_decay swept jointly with groks — the confound is eliminated
    weight_decay: [0.01, 0.1, 0.3, 1.0]
    n_samples: auto
    dims: [20, 24, 28, 32, 40, 48, 56, 64, 80, 96, 112, 128, 160, 200, 256]

  groks:
    type: groks
    weight_decay: [0.01, 0.1, 0.3, 1.0]
    dim_ranges:
      - {start: 20, end: 32, step: 4}
      - {start: 40, end: 64, step: 8}
      - {start: 80, end: 128, step: 16}
      - {start: 160, end: 256, step: 32}
