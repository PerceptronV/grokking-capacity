name: open_top
description: >
  Clean re-measurement (2026-09-23) of the open-top claim: under per-layer
  scaling (base 236) generalisation delay stays positive and non-decreasing
  to the widest affordable widths. Replaces the retired harness's 2.2e8 /
  5e8-parameter cells. Canonical gc-groks, p = 97 and 113, d = 2800 and
  4000 (P ~ 2.5e8 and 5.1e8), three seeds, cap 1500.

defaults:
  operation: "/"
  train_fraction: 0.5
  split_type: random
  depth: 2
  heads: 1
  weight_decay: 1.0
  dropout: 0.2
  lr: 0.001
  beta1: 0.9
  beta2: 0.98
  batch_size: 512
  max_epochs: 1500
  mup_base: 236
  seeds: [42, 43, 44]

experiments:
  wide:
    type: groks
    primes: [97, 113]
    dims: [2800, 4000]

analysis:
  use_default_capacity_constant: true
  intersection_figures: []
