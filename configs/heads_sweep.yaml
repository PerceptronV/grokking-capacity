name: heads_sweep
description: "Attention head count at fixed depth, varying dim (Experiment 3b)"

# All dims must be divisible by max(heads)=8 since dim_head = dim // heads.
# Capacity is re-run per head count because H may affect bits-per-parameter.

defaults:
  operation: "/"
  train_fraction: 0.5
  split_type: random
  depth: 2
  dropout: 0.2
  lr: 0.001
  beta1: 0.9
  beta2: 0.98
  weight_decay: 1.0
  dropout: 0.2
  batch_size: 512
  max_epochs: 5000
  primes: [97, 107, 113, 127, 139]
  seeds: [42, 43, 44, 45]

experiments:
  # Re-measure C_model per head count — H may change bits-per-parameter
  capacity:
    type: capacity
    heads: [1, 2, 4, 8]
    dims: [10, 14, 20]
    n_samples: [1000, 1374, 1891, 2601, 3576, 4917, 6761, 9300]
    primes: [113]
    seeds: [42]

  speed:
    type: speed
    weight_decay: 1.0
    heads: [1, 2, 4, 8]
    n_samples: auto
    dims: [24, 32, 40, 48, 56, 64, 80, 96, 112, 128, 160, 256]

  groks:
    type: groks
    weight_decay: 1.0
    heads: [1, 2, 4, 8]
    dim_ranges:
      - {start: 20, end: 32, step: 4}
      - {start: 40, end: 64, step: 8}
      - {start: 80, end: 128, step: 16}
      - {start: 160, end: 256, step: 32}
