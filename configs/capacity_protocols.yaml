# Random-label capacity measured at both regularisation corners on one
# machine, over the full seven-width grid. Fills the gap that no
# random-label capacity runs exist at the settings the constant is applied
# to (dropout 0.2, weight decay 1.0) beyond three widths, and none at all
# at the historically documented corner (dropout 0.0, weight decay 0.01).
# Analysis compares the fitted capacity slope across corners; dataset-type
# effects are read against the existing modular-data capacity groups.
name: capacity_protocols

defaults:
  p: 113
  depth: 2
  heads: 1
  init_scale: 1.0
  lr: 0.001
  batch_size: 512
  epochs: 5000

experiments:
  capacity_matched:
    type: capacity
    operation: random
    dropout: 0.2
    weight_decay: 1.0
    primes: [113]
    dims: [10, 12, 14, 16, 18, 20, 22]
    n_samples: [1000, 1374, 1891, 2601, 3576, 4917, 6761, 9300]
    seeds: [42]

  capacity_documented:
    type: capacity
    operation: random
    dropout: 0.0
    weight_decay: 0.01
    primes: [113]
    dims: [10, 12, 14, 16, 18, 20, 22]
    n_samples: [1000, 1374, 1891, 2601, 3576, 4917, 6761, 9300]
    seeds: [42]
