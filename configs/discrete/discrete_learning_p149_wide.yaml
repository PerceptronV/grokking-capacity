# Wider channels with coarse quantisation isolate quantisation from a narrow continuous bottleneck.
defaults:
  task: modular
  p: 149
  operation: /
  train_fraction: 0.5
  depth: 2
  heads: 1
  dropout: 0.0
  dim: 96
  latent_dim: 64
  seed: 42
  lr: 0.001
  weight_decay: 1.0
  batch_size: 512
  max_steps: 60000
  eval_every: 100
  checkpoint_every: 2000
  sustained_evals: 3
  stop_on_success: true
runs:
- name: B_l64_q2_p149_s42
  model: discrete
  levels: 2
- name: B_l64_q4_p149_s42
  model: discrete
  levels: 4
- name: C_l64_p149_s42
  model: continuous
  levels: 2
