name: init_scale_sweep
description: "Init scale sensitivity (Experiment 1c): init_scale ∈ {0.5, 1.0, 2.0} at p=113, α=0.5, λ=1.0"

defaults:
  operation: "/"
  train_fraction: 0.5
  split_type: random
  depth: 2
  heads: 1
  dropout: 0.2
  weight_decay: 1.0
  lr: 0.001
  beta1: 0.9
  beta2: 0.98
  batch_size: 512
  max_epochs: 5000
  primes: [97, 107, 113, 127, 139]
  seeds: [42, 43, 44, 45]

experiments:
  capacity:
    type: capacity
    primes: [113]
    init_scale: [0.5, 1.0, 2.0]
    dims: [10, 14, 20]
    n_samples: [1000, 1374, 1891, 2601, 3576, 4917, 6761, 9300]
    seeds: [42]

  speed:
    type: speed
    init_scale: [0.5, 1.0, 2.0]
    n_samples: auto
    dims: [20, 24, 28, 32, 40, 48, 56, 64, 80, 96, 112, 128, 160, 200, 256]

  groks:
    type: groks
    init_scale: [0.5, 1.0, 2.0]
    dim_ranges:
      - {start: 20, end: 32, step: 4}
      - {start: 40, end: 64, step: 8}
      - {start: 80, end: 128, step: 16}
      - {start: 160, end: 256, step: 32}

# Mirror of central.yaml — see central.yaml for full commentary on the
# threshold split, max_dim, and the four sub-claims tested. With swept_axes
# = [init_scale], the sceptic baseline (auto) becomes {init_scale, p} for
# the canonical figure and {init_scale, dim} for the by-prime swap, so the
# M3-vs-M2 F-test directly answers "does the intersection beat predicting
# onset from init_scale and the slice axis alone?"
analysis:
  # Use the per-config measured capacity constant (per-arch from the
  # capacity runs above), falling back to consts.C only when no matching
  # capacity row exists.
  use_default_capacity_constant: false

  intersection_figures:
    - name: intersection
      slice_field: p
      x_field: param_count
      x_label: "Parameter count"
      colour_field: dim
      colour_label: "Dimension"
      max_dim: 256
      delay_train_threshold: 99
      delay_val_threshold: 98
      mem_curve_threshold: 99
      gen_curve_threshold: 99
    - name: intersection_by_prime
      slice_field: dim
      x_field: dataset_bits
      x_label: "Dataset bits"
      colour_field: p
      colour_label: "Prime"
      max_dim: 256
      delay_train_threshold: 99
      delay_val_threshold: 98
      mem_curve_threshold: 99
      gen_curve_threshold: 99

  statistics:
    enabled: true
    alpha: 0.05
    n_permutations: 10000
    n_bootstrap: 10000
    multiple_comparisons: holm
    baseline_predictors: auto
