name: subtraction
description: "Modular subtraction (Experiment 2c)"

# Subtraction is algebraically equivalent to addition (a - b = a + (p-b) mod p),
# but the model does not know this; the learned circuit may differ from addition.
# T_mem uses random data (operation-independent), so n_equiv is the same as
# addition (N_full = p^2). Speed is re-run under the op_sub directory so that
# sidecar metadata accurately records the matched operation.

defaults:
  operation: "-"
  train_fraction: 0.5
  split_type: random
  depth: 2
  heads: 1
  dropout: 0.2
  lr: 0.001
  weight_decay: 1.0
  beta1: 0.9
  beta2: 0.98
  batch_size: 512
  max_epochs: 5000
  primes: [97, 107, 113, 127, 139, 149]
  seeds: [42, 43, 44, 45, 46]

experiments:
  speed:
    type: speed
    n_samples: auto
    dims: [20, 24, 28, 32, 40, 48, 56, 64, 80, 96, 112, 128, 160, 200, 256]

  groks:
    type: groks
    dim_ranges:
      - {start: 20, end: 128, step: 4}
      - {start: 130, end: 600, step: 20}
