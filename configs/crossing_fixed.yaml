name: crossing_fixed
description: 'Crossing programme, fixed rate (registered 2026-09-23): ten widths straddling
  the coarse crossing per prime, gc-speed and gc-groks at every width, five seeds,
  cap 2500. See theory/registrations.md.'
defaults:
  operation: /
  train_fraction: 0.5
  split_type: random
  depth: 2
  heads: 1
  weight_decay: 1.0
  dropout: 0.2
  lr: 0.001
  beta1: 0.9
  beta2: 0.98
  batch_size: 512
  max_epochs: 2500
  mup_base: 0
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
