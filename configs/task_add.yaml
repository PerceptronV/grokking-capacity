name: task_add_sweep
description: "Modular addition (+) (Experiment 2a)"

# NOTE: n_equiv differs between division (N_full = p*(p-1)) and other ops (N_full = p^2).
# n_samples: auto computes the correct n_equiv per (p, operation, train_fraction).
# Capacity experiments do not need to be re-run: they use random data independent of operation.

defaults:
  train_fraction: 0.5
  split_type: random
  depth: 2
  heads: 1
  dropout: 0.2
  lr: 0.001
  weight_decay: 1.0
  beta1: 0.9
  beta2: 0.98
  batch_size: 512
  max_epochs: 5000
  primes: [97, 107, 113, 127, 139]
  seeds: [42, 43, 44, 45]

experiments:
  capacity:
    type: capacity
    primes: [113]
    dims: [10, 14, 20]
    n_samples: [1000, 1374, 1891, 2601, 3576, 4917, 6761, 9300]
    seeds: [42]

  speed_add:
    type: speed
    operation: "+"
    n_samples: auto
    dims: [20, 24, 28, 32, 40, 48, 56, 64, 80, 96, 112, 128, 160, 200, 256]

  groks_add:
    type: groks
    operation: "+"
    dim_ranges:
      - {start: 20, end: 32, step: 4}
      - {start: 40, end: 64, step: 8}
      - {start: 80, end: 128, step: 16}
      - {start: 160, end: 256, step: 32}

# Mirror of central.yaml — see central.yaml for full commentary. No swept
# arch axis here, so the sceptic baseline (auto) is {p} for the canonical
# figure and {dim} for the by-prime swap, exactly like central.yaml. The
# point of running stats on this config is to confirm the predictor
# transfers from division to addition without recalibration.
analysis:
  # Use the per-config measured capacity constant (per-arch from the
  # capacity runs above), falling back to consts.C only when no matching
  # capacity row exists.
  use_default_capacity_constant: false

  intersection_figures:
    - name: intersection
      slice_field: p
      x_field: param_count
      x_label: "Parameter count"
      colour_field: dim
      colour_label: "Dimension"
      max_dim: 256
      delay_train_threshold: 99
      delay_val_threshold: 98
      mem_curve_threshold: 99
      gen_curve_threshold: 99
    - name: intersection_by_prime
      slice_field: dim
      x_field: dataset_bits
      x_label: "Dataset bits"
      colour_field: p
      colour_label: "Prime"
      max_dim: 256
      delay_train_threshold: 99
      delay_val_threshold: 98
      mem_curve_threshold: 99
      gen_curve_threshold: 99

  statistics:
    enabled: true
    alpha: 0.05
    n_permutations: 10000
    n_bootstrap: 10000
    multiple_comparisons: holm
    baseline_predictors: auto
