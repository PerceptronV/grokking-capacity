name: lr_sweep
description: "Learning rate sensitivity with matched lr between speed and groks (Experiment 1b)"

defaults:
  operation: "/"
  train_fraction: 0.5
  split_type: random
  depth: 2
  heads: 1
  dropout: 0.2
  lr: 0.001
  weight_decay: 1.0
  beta1: 0.9
  beta2: 0.98
  batch_size: 512
  max_epochs: 5000
  primes: [97, 107, 113, 127, 139]
  seeds: [42, 43, 44, 45]

experiments:
  capacity:
    type: capacity
    lr: [0.0001, 0.0003, 0.001, 0.003, 0.01]
    primes: [113]
    dims: [10, 14, 20]
    n_samples: [1000, 1374, 1891, 2601, 3576, 4917, 6761, 9300]
    seeds: [42]
  
  speed:
    type: speed
    # Half-decade log-spaced around the Power et al. baseline (1e-3).
    # 1e-4 = too-slow floor; 3e-4 / 1e-3 / 3e-3 = standard regime;
    # 1e-2 = upper edge where Thilak et al. observed slingshot dynamics.
    lr: [0.0001, 0.0003, 0.001, 0.003, 0.01]
    n_samples: auto
    dims: [20, 24, 28, 32, 40, 48, 56, 64, 80, 96, 112, 128, 160, 200, 256]

  groks:
    type: groks
    lr: [0.0001, 0.0003, 0.001, 0.003, 0.01]
    dim_ranges:
      - {start: 20, end: 32, step: 4}
      - {start: 40, end: 64, step: 8}
      - {start: 80, end: 128, step: 16}
      - {start: 160, end: 256, step: 32}

analysis:
  # Pin figure rows to the machine (and seed pool) that produced this
  # suite, so aggregates are comparable across cells when the registry
  # holds replicas from other machines.
  row_filters:
    hosts: ['68-209-75-173']
    seeds: [42, 43, 44, 45]
