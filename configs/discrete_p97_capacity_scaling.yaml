name: p97_continuous_categorical_capacity_constant_scaling
registered: '2026-10-26'
branch: idea/discrete
purpose: Compare t_gen scaling over ten C/B pairs matched in estimated empirical memorisation capacity using separate bits-per-parameter constants.
common:
  p: 97
  depth: 2
  heads: 1
  dropout: 0.2
  lr: 0.001
  weight_decay: 1.0
  beta1: 0.9
  beta2: 0.98
  batch_size: 512
  epochs: 5000
  patience: 100
  min_delta: 0.0001
families:
  C: Ordinary continuous transformer; FF=4*d.
  B: Categorical transformer; FF=4*d, L=d, alphabet8, nonaffine slot LayerNorm eps1e-4, temperature1, deterministic argmax forward and softmax STE, learned embedding sum, no bypass.
dataset:
  operation: division
  training_fraction: 0.5
  examples_per_split: 4656
  target_bits: 30866.284423090663
calibration:
  widths: {C: [32, 48], B: [48, 60]}
  seeds: [61, 62]
  n_samples: [2048, 8192, 16384, 32768]
  existing_C32_grid: [2048, 4096, 8192, 16384]
  reuse: Existing audited same-recipe C32 seed61/62 grids and B48 seed61 N2048/8192, with all frozen-source, configuration, data, initialization and checkpoint hashes rechecked. C32 is the earlier A32 ordinary transformer, relabelled explicitly only for this comparison.
  arithmetic_gates: Existing B48 seed41 and B60 seed321 successful arithmetic checkpoints. New C48 learning gate seed41; seed42 only if seed41 fails. All random-label runs require their exact recipe's successful arithmetic checkpoint.
  random_gates: Each model/seed must reach dropout-free99 on N2048 before larger datasets.
  stopping: Original CapacityTrainer patience100/min_delta1e-4, maximum5000 epochs; retain primary result and continue live optimizer/RNG in200-epoch segments if late100/previous100 drift>1% or unavailable.
  maxima: Maximum final learned bits across N for each architecture and calibration seed. Require interior maximum, <95% label entropy, <5000 epochs, late drift<=1%.
  expansion: If maximum lies at largest N, double only that architecture/seed's largest N, up to131072. Otherwise retain failed calibration diagnostics and stop dependent matching; never replace seeds or label lower bounds as measured capacities.
  constant: For each role, fit through origin to the four architecture/seed maxima: kappa=sum(P*K)/sum(P^2). Record affine fit and residuals as diagnostics, per-seed sensitivity and calibration range. One constant per family; no per-size capacity tuning.
matching:
  C_widths: [32, 36, 40, 44, 48, 52, 56, 60, 64, 68]
  B_width_candidates: {start: 24, stop: 160, step: 2}
  rule: For each fixed C width select even B width minimizing abs(kappa_B*P_B/(kappa_C*P_C)-1), with FF4d. Require ten distinct increasing B widths and predicted mismatch<=5%.
  interpretation: Estimated empirical-capacity matching via calibrated constants, not equal parameter counts and not a claim of direct empirical matching at every point. Report calibration residuals and extrapolation explicitly, including if residuals exceed10%.
  freeze: Freeze constants and all ten pairs before any new confirmation run. Do not select C for grokking or resize from confirmation outcomes.
confirmation:
  seeds: [401, 402, 403, 404, 405, 406, 407, 408, 409, 410]
  runs: 200; ten sizes times two roles times ten paired seeds.
  stopping: Three consecutive held-out99 epochs and current dropout-active online training99, otherwise5000 epochs.
  primary: First held-out99 epoch times10 optimizer updates. Keep missing crossings right-censored at50000. Report all-seed mean only when all ten crossings observed; otherwise a lower bound. Also report median, sustained99, success counts and per-seed trajectories.
  secondary: Online-train99 to held-out98 delay, clipped at zero, and dropout-free counterpart. Missing thresholds remain undefined.
  pairing: Same seed's arithmetic dataset shared across every role and size. Initialization follows the original seed protocol; different shapes mean full weights and subsequent dropout/shuffle RNG are not identical across architectures.
analysis:
  plots: t_gen versus estimated capacity and actual parameter count, success fractions, B/C ratios, per-seed times, calibration fits and residuals.
  scaling: Descriptive log-log slopes per seed on common size points where both roles have all ten observed t_gen values; require at least three such points. Paired seed bootstrap with10000 resamples and seed9001 for slopes and their difference. Label the complete-range conditioning; do not fit success-only averages over censored sizes.
  censoring_sensitivity: Also report descriptive log-log slopes for capped times min(t_gen,50000) over all ten sizes, labelled as capped-time scaling rather than uncensored power laws.
resources:
  devices: [cuda:1, cuda:1, cuda:1, cuda:1, cuda:1, cuda:1, cuda:1, cuda:1]
  threads_per_worker: 2
  note: GPU0 contains unrelated PID1637741 and must be left alone. GPU1 was idle. Use original nonfused AdamW and unchanged training math; wall time is descriptive only.
